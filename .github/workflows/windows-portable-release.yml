name: Build Windows portable release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-portable-release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (for example v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean build-lightweight.spec
          if (!(Test-Path "dist/MoneyPulse-Local.exe")) { throw "Executable missing" }
      - name: Verify frozen executable structure
        shell: pwsh
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer dist/MoneyPulse-Local.exe -l | Out-File archive-contents.txt
          if (!(Test-Path archive-contents.txt)) { throw "PyInstaller archive inspection failed" }
          if ((Get-Item dist/MoneyPulse-Local.exe).Length -lt 1000000) { throw "Frozen executable unexpectedly small" }
      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/MoneyPulse-Local.exe package/
          Copy-Item README.md,LICENSE package/
          @'
          MoneyPulse portable Windows build
          Run MoneyPulse-Local.exe.
          Python is not required.
          OCR requires Tesseract and Poppler to be installed and available on PATH.
          A local model provider (such as LM Studio or Ollama) is required for live extraction.
          No real financial documents should be used for initial testing.
          '@ | Set-Content -Encoding utf8 package/START-HERE.txt
          Compress-Archive -Path package/* -DestinationPath "MoneyPulse-Windows-x64.zip"
          Get-FileHash MoneyPulse-Windows-x64.zip -Algorithm SHA256 | Format-List | Out-File "MoneyPulse-Windows-x64.sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyPulse-Windows-x64
          path: |
            MoneyPulse-Windows-x64.zip
            MoneyPulse-Windows-x64.sha256.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || 'v1.0.1' }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_VERSION" MoneyPulse-Windows-x64.zip MoneyPulse-Windows-x64.sha256.txt --draft --title "MoneyPulse $env:RELEASE_VERSION (Windows portable)" --notes "Windows portable candidate. Requires Tesseract and Poppler for OCR and a local model provider for live extraction. Built and archive-inspected on GitHub-hosted Windows. Native GUI launch and OCR acceptance have NOT been verified; do not publish before manual acceptance."
