# Copy to config.yaml (ignored by git), or use the desktop Configuration dialog.
llm_provider: ollama
llm_host: http://localhost:11434
model: qwen3:8b

# Local/private model endpoints are required by default. Set this to true only when
# you intentionally want OCR-derived document text sent to a remote endpoint.
allow_remote_llm: false

# Optional deterministic underwriting pre-screen policy.
# Leave this empty to calculate underwriting metrics without a rule recommendation.
underwriting_policy: {}
# Example policy:
# underwriting_policy:
#   min_years_in_business: 2
#   min_annual_revenue: 300000
#   min_processing_volume: 30000
#   max_request_to_annual_revenue: 0.20
#   max_request_to_processing_volume: 2.0

# OCR resource ceilings. Increase deliberately for trusted larger documents.
ocr_max_file_mb: 50
ocr_max_pdf_pages: 100
ocr_max_image_pixels: 40000000

# For LM Studio, use llm_provider: lm_studio, port 1234, and its exact model ID.
# Optional: absolute path to Tesseract if it is not on PATH.
tesseract_path: null
